<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Development Quiz</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="quiz-container">
        <div id="question-container">
            <h2 id="question">What does CSS stand for?</h2>
            <img src="images/css-icon.png" alt="CSS Icon" class="question-image">
            <div class="options">
                <button class="option" onclick="checkAnswer(1)">
                    <img src="images/empty-icon.png" alt="Icon" class="option-icon"> Cascading Style Sheets
                </button>
                <button class="option" onclick="checkAnswer(2)">
                    <img src="images/empty-icon.png" alt="Icon" class="option-icon"> Computer Style Sheets
                </button>
                <button class="option" onclick="checkAnswer(3)">
                    <img src="images/empty-icon.png" alt="Icon" class="option-icon"> Creative Style Sheets
                </button>
                <button class="option" onclick="checkAnswer(4)">
                    <img src="images/empty-icon.png" alt="Icon" class="option-icon"> Colorful Style Sheets
                </button>
            </div>
        </div>
        <div id="result-container" class="hidden">
            <h2 id="result-text"></h2>
            <button onclick="nextQuestion()">Next Question</button>
        </div>
        <div id="timer-container">
            <p>Time left: <span id="timer">30</span> seconds</p>
        </div>
        <div id="progress-bar-container">
            <progress id="progress-bar" max="100" value="0"></progress>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
